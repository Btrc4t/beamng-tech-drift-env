[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beamng_tech_env"]

[project]
name = "beamng_tech_env"
version = "0.39.1"
requires-python = ">=3.10"
dependencies = [
  "gymnasium",
  "numpy",
  "beamngpy",
  # .rpl parsing (core/rpl.py, imported by the replay env)
  "msgpack",
  # remote env (envs/remote.py): the tcom loop runs on the game's host and
  # the observation crosses the network over ZeroMQ
  "pyzmq",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pre-commit",
]
# live debug window (beamng_tech_env.debug); cv2 is imported lazily, so the
# env works without it until DebugWindow is used. scipy is likewise lazy
# (the road centerline's Gaussian blur, core.roads.road_centerline).
debug = [
  "opencv-python",
  "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "game: tests that launch BeamNG.drive (slow, need BNG_HOME/DISPLAY/XAUTHORITY)",
]
